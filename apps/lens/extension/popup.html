<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LENS</title>
    <style>
      :root {
        --violet: #8b5cf6;
        --indigo: #6366f1;
        --cyan: #22d3ee;
        --lime: #a3e635;
        --rose: #f43f5e;
        --ink-950: #0b0a1a;
        --ink-900: #15132b;
        --ink-800: #1f1c3d;
        --ink-500: #5e5a7e;
        --ink-400: #807ca0;
        --ink-300: #a8a4c7;
        --ink-200: #d0cde5;
        --ink-100: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 340px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: radial-gradient(
            1000px 500px at 20% -10%,
            rgba(139, 92, 246, 0.18),
            transparent 60%
          ),
          radial-gradient(
            800px 400px at 110% 120%,
            rgba(34, 211, 238, 0.12),
            transparent 60%
          ),
          var(--ink-950);
        color: var(--ink-100);
        overflow: hidden;
      }

      .wrap {
        padding: 14px 14px 12px;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .logo {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .brand {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand-o {
        background: linear-gradient(135deg, var(--violet), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .tagline {
        font-size: 10px;
        color: var(--ink-500);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }

      /* Status */
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid rgba(139, 92, 246, 0.15);
        border-radius: 10px;
        background: rgba(139, 92, 246, 0.04);
        margin-bottom: 12px;
        font-size: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink-500);
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(94, 90, 126, 0.1);
      }

      .status-dot.connected {
        background: var(--lime);
        box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.15),
          0 0 10px rgba(163, 230, 53, 0.4);
        animation: pulse 2s ease-in-out infinite;
      }

      .status-dot.error {
        background: var(--rose);
        box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      .status-text {
        flex: 1;
        color: var(--ink-200);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-count {
        font-size: 10px;
        color: var(--ink-500);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* Open-tabs preview */
      .tabs-preview {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        max-height: 160px;
        overflow-y: auto;
      }

      .tabs-header {
        font-size: 10px;
        color: var(--ink-500);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
      }

      .tabs-count {
        color: var(--cyan);
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 12px;
        color: var(--ink-200);
      }

      .tab-item + .tab-item {
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }

      .tab-kind {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .tab-kind.youtube {
        background: var(--rose);
      }
      .tab-kind.brightspace,
      .tab-kind.webpage {
        background: var(--cyan);
      }
      .tab-kind.pdf {
        background: #f59e0b;
      }

      .tab-title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tab-empty {
        font-size: 12px;
        color: var(--ink-500);
        text-align: center;
        padding: 12px 0;
      }

      /* Buttons */
      .btn {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--violet), var(--indigo));
        color: white;
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink-200);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-top: 6px;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(139, 92, 246, 0.3);
      }

      .btn svg {
        width: 14px;
        height: 14px;
      }

      /* Message */
      .msg {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 11px;
        display: none;
        line-height: 1.4;
      }

      .msg.show {
        display: block;
      }

      .msg.success {
        background: rgba(163, 230, 53, 0.08);
        border: 1px solid rgba(163, 230, 53, 0.2);
        color: var(--lime);
      }

      .msg.error {
        background: rgba(244, 63, 94, 0.08);
        border: 1px solid rgba(244, 63, 94, 0.2);
        color: var(--rose);
      }

      .msg.info {
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.2);
        color: var(--cyan);
      }

      /* Footer */
      .footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--ink-500);
      }

      .settings-link {
        color: var(--ink-400);
        cursor: pointer;
        text-decoration: none;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .settings-link:hover {
        color: var(--ink-200);
        background: rgba(255, 255, 255, 0.04);
      }

      /* Settings panel */
      .settings-panel {
        display: none;
        margin-top: 10px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
      }

      .settings-panel.show {
        display: block;
      }

      .settings-label {
        font-size: 10px;
        color: var(--ink-500);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
      }

      .settings-input {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.3);
        color: var(--ink-100);
        font-size: 11px;
        font-family: ui-monospace, monospace;
        outline: none;
      }

      .settings-input:focus {
        border-color: var(--violet);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.2);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.4);
      }

      /* Guide — goal-driven screen walkthrough */
      .divider {
        height: 1px;
        background: rgba(139, 92, 246, 0.14);
        margin: 14px 0 12px;
      }

      .section-label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-500);
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-label .pill {
        font-size: 8px;
        letter-spacing: 0.06em;
        padding: 2px 5px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--lime), var(--cyan));
        color: var(--ink-950);
      }

      .goal-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(139, 92, 246, 0.2);
        border-radius: 9px;
        padding: 9px 10px;
        color: var(--ink-100);
        font: inherit;
        font-size: 12px;
        resize: none;
        outline: none;
      }

      .goal-input:focus {
        border-color: rgba(34, 211, 238, 0.45);
      }

      .goal-input::placeholder {
        color: var(--ink-500);
      }

      .guide-hint {
        font-size: 10px;
        color: var(--ink-500);
        margin-top: 6px;
        line-height: 1.4;
      }

      .guide-live {
        border: 1px solid rgba(163, 230, 53, 0.25);
        background: rgba(163, 230, 53, 0.05);
        border-radius: 10px;
        padding: 10px 11px;
        margin-bottom: 10px;
        display: none;
      }

      .guide-live.show {
        display: block;
      }

      .guide-live-goal {
        font-size: 10px;
        color: var(--ink-400);
        margin-bottom: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .guide-live-step {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.4;
      }

      .guide-live-why {
        font-size: 11px;
        color: var(--cyan);
        margin-top: 6px;
        line-height: 1.4;
      }

      /* Spin */
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="logo">
          <img src="icons/icon-128.png" alt="LENS" />
        </div>
        <div>
          <div class="brand">Study<span class="brand-o">O</span></div>
          <div class="tagline">One click. Any tab. Instant study session.</div>
        </div>
      </div>

      <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking…</span>
        <span class="status-count" id="statusCount">–</span>
      </div>

      <div class="tabs-preview" id="tabsPreview">
        <div class="tabs-header">
          <span>Open study tabs</span>
          <span class="tabs-count" id="tabsPreviewCount">–</span>
        </div>
        <div id="tabsList">
          <div class="tab-empty">Sniffing out your tabs…</div>
        </div>
      </div>

      <button class="btn btn-primary" id="captureAllBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <span>Capture all study tabs</span>
      </button>

      <button class="btn btn-secondary" id="captureThisBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Just capture this page
      </button>

      <button class="btn btn-secondary" id="openLENSBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3h7v7" />
          <path d="M10 14L21 3" />
          <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
        </svg>
        Open LENS
      </button>

      <div class="divider"></div>

      <div class="section-label">
        Guide me through it <span class="pill">NEW</span>
      </div>

      <div class="guide-live" id="guideLive">
        <div class="guide-live-goal" id="guideLiveGoal"></div>
        <div class="guide-live-step" id="guideLiveStep">Looking at your screen…</div>
        <div class="guide-live-why" id="guideLiveWhy"></div>
      </div>

      <textarea
        class="goal-input"
        id="goalInput"
        rows="2"
        placeholder="What are you trying to do? e.g. launch a t3.micro EC2 instance in us-east-1"
      ></textarea>

      <button class="btn btn-primary" id="guideBtn" style="margin-top: 8px">
        Start guiding
      </button>

      <div class="guide-hint" id="guideHint">
        LENS watches the tab you're on, points at the next control, and asks
        you why it matters before you click it.
      </div>

      <div class="msg" id="msg"></div>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-label">LENS API URL</div>
        <input
          type="text"
          class="settings-input"
          id="apiBaseInput"
          placeholder="https://studystudio.us"
        />
      </div>

      <div class="footer">
        <span>v1.0.0</span>
        <a class="settings-link" id="settingsLink">Settings</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
