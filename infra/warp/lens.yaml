# Warp workflows. These are the commands demoed at the booth - keep them one-liners.
---
name: lens dev
command: cd apps/lens && npm run dev
tags: [lens, dev]
description: Start the LENS Next.js app on localhost:3000.
---
name: lens db setup
command: cd apps/lens && npm run db:setup
tags: [lens, dev]
description: Create the MongoDB collections and indexes.
---
name: lens elastic up
command: cd apps/lens && docker compose -f ../../infra/elastic/docker-compose.yml up -d && npm run elastic:setup
tags: [lens, dev]
description: Start local Elasticsearch and create the source index.
---
name: lens boundary
command: cd apps/lens && npm run boundary
tags: [lens, dev]
description: Fail if any "use client" file can reach Mongo or a server secret through value imports. Prints the import chain.
---
name: lens test
command: cd apps/lens && npm run typecheck && npm test
tags: [lens, dev]
description: Typecheck and run vitest.
---
name: lens demo token
command: curl -s -X POST localhost:3000/api/demo/token | jq
tags: [lens, demo]
description: Mint a short-lived judge token (needs DEMO_MODE=1 and DEMO_TOKEN_SECRET in apps/lens/.env.local).
